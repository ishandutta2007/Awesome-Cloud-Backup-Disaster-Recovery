<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 7s ease-in-out infinite; }
      .floating-card-3 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .glowing-orb { transform-origin: center; animation: pulseGlow 5s ease-in-out infinite; }
      .animated-stream { stroke-dasharray: 8, 8; animation: dashFlow 2s linear infinite; }
      .rotating-ring { transform-origin: 1040px 180px; animation: orbit 24s linear infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs in the background -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" filter="url(#glow)" class="glowing-orb" opacity="0.18" />
  <circle cx="1060" cy="260" r="140" fill="#818cf8" filter="url(#glow)" class="glowing-orb" opacity="0.22" />
  <circle cx="620" cy="330" r="100" fill="#c084fc" filter="url(#glow)" class="glowing-orb" opacity="0.15" />

  <!-- Animated Data Streams (DR Replication lines) -->
  <path d="M 50 300 Q 250 260 480 320 T 900 280 T 1150 310" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" class="animated-stream" />
  <path d="M 80 50 Q 320 90 560 40 T 960 70 T 1140 40" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3" class="animated-stream" />

  <!-- Interactive Graphic / Architectural Cards on the Right Side (Non-obstructing) -->
  <g class="rotating-ring" opacity="0.25">
    <circle cx="1040" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 12" />
    <circle cx="1040" cy="180" r="120" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="8 16" />
  </g>

  <!-- Dynamic Card: Cloud Backup & Storage -->
  <g class="floating-card-1">
    <rect x="880" y="55" width="230" height="64" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="912" cy="87" r="16" fill="#0284c7" fill-opacity="0.4" />
    <path d="M 905 91 A 6 6 0 0 1 911 82 A 9 9 0 0 1 922 84 A 6 6 0 0 1 922 91 Z" fill="#38bdf8" />
    <text x="938" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Cloud Native Backup</text>
    <text x="938" y="99" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">RPO &lt; 5m • Immutable Snapshots</text>
  </g>

  <!-- Dynamic Card: Disaster Recovery -->
  <g class="floating-card-2">
    <rect x="910" y="145" width="245" height="64" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="942" cy="177" r="16" fill="#4f46e5" fill-opacity="0.4" />
    <!-- Shield / DR Icon -->
    <path d="M 942 169 L 951 173 V 180 C 951 185 942 189 942 189 C 942 189 933 185 933 180 V 173 Z" fill="#818cf8" />
    <text x="968" y="172" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Disaster Recovery (DRaaS)</text>
    <text x="968" y="189" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Zero Data Loss • Instant Failover</text>
  </g>

  <!-- Dynamic Card: Multi-Cloud Resilience -->
  <g class="floating-card-3">
    <rect x="860" y="235" width="250" height="64" rx="12" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="892" cy="267" r="16" fill="#9333ea" fill-opacity="0.4" />
    <!-- Sync / Resilience Icon -->
    <path d="M 886 267 A 6 6 0 1 1 897 271 M 897 267 V 272 H 892" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <text x="918" y="262" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">Multi-Cloud Resilience</text>
    <text x="918" y="279" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">SaaS, K8s, On-Prem &amp; Hybrid</text>
  </g>

  <!-- Foreground Main Title & Badges / Description (Never obstructed) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="256" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" />
      <text x="28" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED RESILIENCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">Awesome Cloud Backup</text>
    <text x="0" y="178" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">&amp; Disaster Recovery</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="222" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16">
      Enterprise SaaS Data Protection, Cloud-Native Resilience &amp; Open-Source DR Frameworks
    </text>

    <!-- Highlights Pills (Static in foreground) -->
    <g transform="translate(0, 256)">
      <rect x="0" y="0" width="138" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Ransomware DR</text>

      <rect x="150" y="0" width="144" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="164" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">☁️ SaaS Protection</text>

      <rect x="306" y="0" width="158" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="320" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Open-Source Stack</text>

      <rect x="476" y="0" width="152" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="490" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔄 Zero-Loss RPO</text>
    </g>
  </g>
</svg>
